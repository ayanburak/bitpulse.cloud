<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- The layers of a vertical video, 1080 by 1920 pixels. scripts/social.ts opens this file twice: once
     for the logo and the line that sit over the clip, with a clear background, and once with the end
     class for the closing screen. The clip itself is placed by ffmpeg between y 360 and y 1320. -->
<style>
@font-face { font-family: Archivo; src: url(../public/fonts/archivo-latin.woff2) format("woff2"); font-weight: 100 900; font-stretch: 62% 125%; unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
@font-face { font-family: Archivo; src: url(../public/fonts/archivo-latin-ext.woff2) format("woff2"); font-weight: 100 900; font-stretch: 62% 125%; unicode-range: U+0100-02AF, U+0304, U+0308, U+0329, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
body { font-family: Archivo, sans-serif; color: #f3f4f0; }
/* The shadows keep the white text readable over a bright frame. */
.logo { position: absolute; top: 150px; left: 72px; display: flex; align-items: center; gap: 14px; font-size: 44px; font-weight: 780; letter-spacing: -.035em; line-height: 1; text-shadow: 0 2px 12px rgba(0,0,0,.6); }
.logo svg { width: 46px; height: 46px; }
/* The right margin is wider, Instagram puts its buttons on that side. */
.text { position: absolute; top: 1390px; left: 72px; right: 120px; font-size: 64px; font-weight: 720; line-height: 1.14; letter-spacing: -.02em; text-wrap: balance; text-shadow: 0 3px 18px rgba(0,0,0,.85); }
.text em { font-style: normal; color: #8fa2ff; }
.end-screen { display: none; }
body.end { background: #141513; }
body.end .logo, body.end .text { display: none; }
body.end .end-screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 40px; }
.end-screen .brand { display: flex; align-items: center; gap: 28px; font-size: 96px; font-weight: 780; letter-spacing: -.035em; line-height: 1; }
.end-screen svg { width: 100px; height: 100px; }
.end-screen p { font-size: 52px; font-weight: 600; opacity: .9; }
</style>
</head>
<body>
<div class="logo">
  <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" fill="#1430d6"/><path fill="#f3f4f0" fill-rule="evenodd" d="M6 3h8v8h12v18H6zM14 17v6h4v-6z"/></svg>
  bitpulse
</div>
<p class="text"></p>
<div class="end-screen">
  <div class="brand">
    <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" fill="#1430d6"/><path fill="#f3f4f0" fill-rule="evenodd" d="M6 3h8v8h12v18H6zM14 17v6h4v-6z"/></svg>
    bitpulse
  </div>
  <p>Full story at bitpulse.cloud</p>
</div>
</body>
</html>
