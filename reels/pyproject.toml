[project]
name = "bitpulse-reels"
version = "0.1.0"
description = "Cuts Instagram reels for Bitpulse news stories from an edit file."
requires-python = ">=3.12"
dependencies = [
    "faster-whisper>=1.2.1",
    "numpy>=2.0",
    "pillow>=11.0",
    "pyyaml>=6.0",
]

[project.scripts]
reels = "reels.__main__:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reels"]
