# The reel approved for the story on the US reward for tips on Iran's nuclear program.
# Rendering it again is the check that the engine still makes the same video.
story: 2026-11-07-iran-nuclear-reward

music:
  file: Impact Prelude.mp3
  from: 35.73

credits: ["The White House", "US Air Force", "Rewards for Justice, US Department of State"]

sources:
  kennedy: src/wh_speech.mp4
  palm: src/palm.mp4
  b2: src/b2.webm
  poster: src/rfj_ENG.jpg

blocks:
  - speech:
      voice: {source: kennedy, from: 47.18, to: 52.05}
      shots:
        - {source: b2, from: 0.3, frames: 74, crop: "405:720:438:0", look: archive, push: 0.024}
        - {source: b2, from: 8.15, crop: "405:720:690:0", look: archive}
      lines:
        - [47.28, 49.61, "If we didn't go in with those beautiful"]
        - [49.65, 51.98, "B-2 bombers a little more than a year ago,"]

  - speech:
      voice: {source: kennedy, from: 55.60, to: 57.90}
      shots:
        - {sync: true, crop: "484:860:688:0"}
      lines:
        - [55.65, 57.83, "today there would be no Israel."]

  - speech:
      voice: {source: kennedy, from: 68.57, to: 73.27, fade_out: 0.8}
      shots:
        - {sync: true, crop: "400:711:730:30"}
      lines:
        - [68.76, 71.45, "Iran will never, ever have a nuclear weapon."]
        - [71.64, 72.85, "You can rest assured."]

  - card:
      seconds: 1.73
      lines: ["The same day,", "the US put this out."]
      reveal: [0.18, 0.78]
      sounds:
        - {name: boom, at: 0, gain: 1.1}
        - {name: whoosh, at: 1.58, gain: 0.7}

  - document:
      source: poster
      steps:
        - via: [0.95, 1024, 150]
          focus: [390, 8, 1128, 128]
          zoom: 1.10
          pause: 0.2
          hold: 1.3
          say: It wants to know who works on Iran's program.
        - via: [1.0, 520, 450]
          focus: [52, 334, 668, 392]
          zoom: 1.55
          hold: 1.1
          say: It can also relocate a source and their family.
        - via: [1.0, 470, 860]
          focus: [8, 920, 240, 982]
          zoom: 1.95
          hold: 2.4

  - speech:
      voice: {source: palm, from: 54.67, to: 57.78, prelap: 0.5, gain: 1.1, fade_in: 0.03, fade_out: 0.04}
      shots:
        - {sync: true, crop: "608:1080:690:0"}
      lines:
        - [54.70, 55.82, "We're dealing with them now."]
        - [56.30, 57.72, "They want to make a deal very badly."]

  - card:
      seconds: 4.4
      lines: ["Washington hasn't said", "what would earn", "the full amount."]
      reveal: [0.25, 0.75, 0.75]
      sounds:
        - {name: boom, at: 0, gain: 0.75}

  - closing: {}
