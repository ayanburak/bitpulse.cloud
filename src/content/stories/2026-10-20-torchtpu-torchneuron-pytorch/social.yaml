caption: |
  Google and Amazon made the same move on 20 October: AI code written in PyTorch can now run more easily on their own chips. Google open-sourced TorchTPU, built with Meta, and Amazon released TorchNeuron for its Trainium chips. Both are trying to win developers in a field led by Nvidia.
