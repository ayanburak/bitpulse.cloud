caption: |
  Four volunteers walked out of NASA's simulated Mars habitat in Houston on 31 October, after 378 days inside a 3D-printed habitat at Johnson Space Center. Ross Elder, Ellen Ellis, Matthew Montgomery and James Spicer took simulated spacewalks, grew crops and lived with messages to Earth slowed down on purpose.
