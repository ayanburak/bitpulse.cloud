caption: |
  Nintendo Switch Sports Resort is out on the Switch 2. For the first time in the series, players can leave the court and roam Wuhu Island. There are twelve sports, from archery and boxing to thumb wrestling, plus skateboarding, power cruising and flying a propeller plane.
