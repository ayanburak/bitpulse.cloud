      The US military says it fired on a cargo ship in the Gulf of Oman after its crew ignored repeated warnings.
caption: |
  US Central Command, known as CENTCOM, says a US military aircraft fired on and disabled the St. Kitts-flagged cargo ship M/V Huda in the Gulf of Oman on Saturday, November 7. The command says the ship had tried to leave the region after visiting an Iranian port.

  According to CENTCOM, the civilian crew ignored repeated warnings and tried several times to violate the US naval blockade of Iran. The command says its forces directed the crew to abandon the targeted spaces, and the aircraft then fired precision munitions at the ship's stern. A video posted by CENTCOM shows an explosion at the stern, according to DW.

  CENTCOM's statement does not say whether anyone was hurt. No source in this report gives Iran's position on the M/V Huda.

  The command also says that since July US forces have redirected 147 commercial vessels that complied with the blockade and disabled five merchant ships that refused. CENTCOM estimates the blockade has kept more than $25 billion in Iranian crude oil from being exported.
