      Officials say an inspection indicated a train was standing still on the track when it was hit. Seven died.
caption: |
  Seven people were killed and more than 100 were injured when two trains collided on Sunday in al-Ayyat district, Giza province, about 30 miles south of Cairo, officials said. According to Egypt's transport ministry, a train travelling to the south-western Fayoum province crashed into the rear of a train heading to the southern province of Aswan. An inspection indicated that the Cairo-Aswan train had been stationary on the same track, officials said.

  The Guardian's report gives no cause for the collision. A resident of Kafr Girza in al-Ayyat said people rushed to the scene, pulled out survivors and called ambulances. The resident said some passengers were trapped inside the stationary train and died.

  President Abdel Fatah al-Sisi said in a social media post that he had ordered a prompt investigation. The Egyptian railway authority said emergency teams and cranes had been sent to clear the wreckage and restore train services to their normal schedule as soon as possible.

  The Guardian notes that train derailments and crashes are common in Egypt, where the railway system has a history of mismanagement and poor maintenance of equipment. Last September, a train driver and his assistant were injured when two freight trains collided in the same district. Egypt's deadliest train crash was in 2002, when more than 300 people were killed after a fire broke out on an overnight train from Cairo to southern Egypt.
