caption: |
  Trump posted on Truth Social on Saturday that Dana White, the president and CEO of the Ultimate Fighting Championship, "has been offered the job of Press Secretary of the United States." He wrote: "Dana, please take the job!"

  The White House press secretary job has been empty since October 16, when Katie Zacharia left after less than a week.

  It is not known whether the offer is genuine. The BBC says it is unclear, and CNBC reports that neither the White House nor the UFC responded right away.

  After the post, White shared an Instagram story showing himself behind the lectern in the White House briefing room, with the caption "On to the next chapter." It is unclear whether he has accepted or is joking. The Jerusalem Post reports that White has said before that he has no political ambitions and no interest in a government job.

  The first photo was taken on June 14, 2026, at UFC Freedom 250 on the White House South Lawn.
