x: |
  Agility Robotics, an Oregon maker of walking, two-armed robots, began trading on the Nasdaq on 5 November under the code AGLT. Its 2025 revenue was $1.78 million.

  The shares opened at just over $11, fell as low as $8.40 and closed at about $11.50.
pages:
  - image: https://cdn.prod.website-files.com/6980c63561bbbeb67b4b7ab5/6aec6faf77fbae9b23a165ea_Press-Release_051126.jpg
    credit: Agility Robotics
    text: |
      A company with about $1.8 million in revenue last year now has shares on the Nasdaq stock exchange.
  - image: https://www.therobotreport.com/wp-content/uploads/2026/09/Agility_Digit5_06-featured.jpg
    credit: Agility Robotics, via The Robot Report
    text: |
      Agility's robot, Digit, stands on two legs, has two arms and moves storage containers, called totes, from one place to another in warehouses. Agility says Digit has logged more than 65,000 hours of real work.
  - image: https://www.therobotreport.com/wp-content/uploads/2026/10/Agility_Digit_GXO.jpg
    credit: Agility Robotics, via The Robot Report
    text: |
      At a facility run by the logistics firm GXO in Flowery Branch, Georgia, Digit places totes on conveyor belts. It has moved more than 100,000 of them. GXO plans to bring Digit to two more American sites in early 2027.
  - image: https://www.therobotreport.com/wp-content/uploads/2026/11/Agility_Digit5_04-featured.jpg
    credit: Agility Robotics, via The Robot Report
    text: |
      Agility's hopes rest on its next robot, Digit 5. The company says it has more than $300 million in committed orders for it, spread over several years, and it is the only source for that figure.
caption: |
  Agility Robotics, an Oregon maker of walking, two-armed robots, began trading on the Nasdaq on 5 November under the stock code AGLT. It merged with Churchill Capital Corp XI, a blank-check company, and the deal brought in about $465 million before costs. In 2025 Agility had revenue of $1.78 million, up from $310,000 in 2024, and it lost $138.1 million. Its robot, Digit, moves storage containers in warehouses. The shares opened at just over $11, above the $10 per share price used in the deal, fell as low as $8.40, rose as high as $12.15 and closed at about $11.50. The Nasdaq Composite index fell more than 5% that day.
