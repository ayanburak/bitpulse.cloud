caption: |
  Alphabet shares fell 12.6 percent on 29 October, the steepest one-day drop since Google's parent went public in 2004. Close to $500 billion in market value was gone in a day. Revenue and profit both missed forecasts, and Google says its chat-style AI Mode is growing fast but earns less so far.
