      The US is offering up to $20 million for tips about Iran's nuclear program. It may also offer relocation to the person who provides the information and their family, case by case.
caption: |
  The United States is offering up to $20 million, and possibly relocation, for information about Iran's nuclear program. US Central Command announced it on X on Friday, November 6. The State Department's Rewards for Justice program is seeking information on Iran's nuclear facilities, equipment and the personnel linked to them, such as scientists.

  The program was set up in 1984 to pay for information that protects American lives and interests. The Jerusalem Post reports that it has paid more than $250 million to over 125 people since then, keeps sources confidential and can offer relocation to a source and their family case by case. The State Department has not said what information would earn the full amount.
