x: |
  Digital sales were 60.7% of Nintendo's console game software sales in the six months to September, up from 54.5% a year earlier.

  Nintendo says the rise came mainly from downloads of games that are also sold in boxes. The latest quarter slipped to 59.8% from 61.5%.
pages:
  - image: https://www.nintendo.co.jp/img/og_nintendo.png
    credit: Nintendo
    text: |
      Of every 100 yen Nintendo took in from console game software between April and September, about 61 came from digital sales. A year earlier it was 54.5.
  - image: https://upload.wikimedia.org/wikipedia/commons/d/dd/NS_handhelds_and_games_display_case_2.jpg
    credit: Ominae, CC BY-SA 4.0
    text: |
      Downloadable versions of games that are also sold in boxes made up 59.2% of digital sales, up from 46.3% a year ago. Nintendo's results release says the rise was mainly due to this increase.
  - image: https://assets.nintendo.com/image/upload/v1749008083/ncom/en_US/merchandising/feature-banner/2025/Nintendo%20Switch%202%20Welcome%20Center/1920x1080_feature_banner.png
    credit: Nintendo
    text: |
      Nintendo sold fewer consoles but earned more. Switch 2 hardware sales were 6.49 million units in the half-year, down 37.4%. Net sales fell 12.1%, yet operating profit rose 49.1%.
  - image: https://assets.nintendo.com/image/upload/ncom/en_US/merchandising/Showrooms/2026%20Holiday/MKW_bundle_product_shot
    credit: Nintendo
    text: |
      One catch: software sold together with a console, such as Mario Kart World, counts as hardware revenue, not as software or digital sales.
caption: |
  Digital sales were 60.7% of Nintendo's game software sales for its consoles in the six months from April to September, up from 54.5% a year earlier. Digital sales rose 60.5%, to 249.6 billion yen. Nintendo counts downloadable versions of games that are also sold in boxes, download-only games, add-on content and Nintendo Switch Online as digital. Downloadable versions of boxed games made up 59.2% of digital sales, up from 46.3%, and Nintendo says the rise was mainly due to this. The latest quarter slipped a little: digital was 61.5% of software sales in April to June and 59.8% in July to September. Software sold together with a console, such as Mario Kart World, counts as hardware revenue, not as software or digital sales.
