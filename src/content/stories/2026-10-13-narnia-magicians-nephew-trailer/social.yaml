caption: |
  The first trailer for Greta Gerwig's Narnia: The Magician's Nephew is out. The film tells how Narnia was born. Daniel Craig plays Uncle Andrew, Emma Mackey the White Witch, and Meryl Streep voices Aslan. The trailer opens with Led Zeppelin's Stairway to Heaven, a song the band seldom licenses.
