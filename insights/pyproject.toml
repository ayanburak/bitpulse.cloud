[project]
name = "bitpulse-insights"
version = "0.1.0"
description = "Reads the numbers of the Bitpulse Instagram posts and hands them to the Bitpulse API."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
insights = "insights.__main__:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["insights"]
