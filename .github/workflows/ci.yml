# Every push is tested and scanned. Only main can release, and only when all checks pass.
#
# The deploy job never checks out or runs code from this repository. It receives the finished
# site from the verify job, so changed code can not reach the server key. Actions are pinned to
# full commit hashes because a version tag can be moved after it was reviewed.

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: dist
          if-no-files-found: error
          retention-days: 7

  secrets:
    name: Scan for secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  design-lock:
    name: Check locked files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: node scripts/design-hash.ts --check
        env:
          EXPECTED_HASH: ${{ vars.DESIGN_HASH }}

  deploy:
    name: Release
    needs: [verify, secrets, design-lock]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: dist
      # The server key can only run the bitpulse-release command, it opens no shell.
      - name: Upload the release
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          tar -czf site.tar.gz -C dist .
          name="release-$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}"
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o BatchMode=yes "bitpulse-deploy@$DEPLOY_HOST" "release $name" < site.tar.gz
      - name: Check the live site
        id: check
        run: |
          for path in /en/ /tr/ /en/about/ /tr/archive/ /sitemap.xml; do
            curl -fsS --retry 3 --retry-delay 2 -o /dev/null "https://bitpulse.cloud$path"
          done
      - name: Return to the previous release
        if: failure() && steps.check.conclusion == 'failure'
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o BatchMode=yes "bitpulse-deploy@$DEPLOY_HOST" rollback
