# Every feed the radar listens to. Each one was opened and checked on 2026-11-11.
# The share of each region is measured by the number of stories, not the number of feeds.
# Inside every region, outlets known on the left and on the right are listed together,
# because a story seen from one side only is not a neutral starting point.
# State media are marked so the editor knows what they are.

