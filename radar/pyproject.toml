[project]
name = "bitpulse-radar"
version = "0.1.0"
description = "Listens to world news feeds and sends the best new stories to an editor on Telegram."
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.0",
    "feedparser>=6.0",
    "trafilatura>=2.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
radar = "radar.__main__:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["radar"]
