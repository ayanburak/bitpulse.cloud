    text: |
      Lionel Messi has won the MLS Golden Boot two seasons in a row, the first player in league history to do it.
caption: |
  Messi scored 26 goals in 31 appearances this season, four clear of FC Dallas striker Musa, who finished second with 22. He also set up 17 goals, and his 43 goal contributions were again the best in the league. He is only the sixth player to win the award twice. The season before he scored 29 goals, which made him the second player in league history to reach at least 25 goals in back-to-back years.

  Messi did not score on the last day of the regular season. He set up the first two goals from corners in a 3-3 draw with Charlotte and hit the post in stoppage time. Miami led 3-0 in the first half before Charlotte came back to level in the 90th minute.

  Miami, the defending MLS Cup champions, finished second in the Eastern Conference on 60 points. Nashville won the East with 77 points, which Al Jazeera describes as an all-time MLS record for a season. The playoffs begin on November 19, and Miami open against Columbus in a first round played over three games. Messi could also become the first three-time winner of the Landon Donovan MLS MVP award.
