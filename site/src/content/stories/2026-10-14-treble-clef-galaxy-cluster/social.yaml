caption: |
  A glow in the sky shaped like a treble clef turned out to be two giant galaxy clusters crashing into each other, NASA said on 14 October. It sits behind the Milky Way, where dust blocks visible light, so radio telescopes and the Chandra X-ray Observatory had to find it.
