caption: |
  Archaeologists in Bursa, Türkiye, have found a nearly 2,000-year-old cremation grave among the seats of the ancient theater of Apollonia. The city buried its dead in a cemetery by its entrance, so no one expected a grave here. The excavation team says the reason is still open, and the digging goes on.
