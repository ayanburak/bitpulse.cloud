      Neither bloc won a majority in October. Israel's president picked Netanyahu's rival to try to form the government.
caption: |
  Israeli President Isaac Herzog has chosen former military chief Gadi Eisenkot to try to form the next government, his office said in a statement on Saturday. Eisenkot leads the Yashar party and heads an alliance against Prime Minister Benjamin Netanyahu.

  Neither side won a majority in the October 27 election. The Knesset has 120 seats and 61 are needed to govern. Netanyahu's religious-nationalist coalition won 53 seats, and his party, Likud, took 27, the most of any single party. Yashar won 21, and Eisenkot's wider coalition won 48. Two parties representing Israel's Arab minority won a record 19.

  Eisenkot has 28 days to build a government, with a possible 14-day extension. Reuters lists three possible routes: a minority government with outside Arab support, a coalition with ultra-Orthodox parties that he and his allies have shunned in the past, or a unity government with Netanyahu. Analysts say all three are unlikely.
