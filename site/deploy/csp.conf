# file: site/deploy/csp.conf
# description: The content security policy of the site, included by nginx next to its other headers.
#
# NOTE: The hash belongs to the inline theme script in src/Document.tsx. WebAssembly is allowed
# because the search index runs on it. deploy/release-code.sh installs this file on the server.
add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'sha256-nTKJI27OEjHUuCDOKdNVueeVLp6a1HOJr5QJ2l9KIrU=' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; form-action 'self'; base-uri 'none'; frame-ancestors 'none'" always;
