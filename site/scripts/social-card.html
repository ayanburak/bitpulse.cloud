<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- One Instagram page, 1080 by 1350 pixels. scripts/social.ts opens this file and fills in the image and the text. -->
<style>
@font-face { font-family: Archivo; src: url(../public/fonts/archivo-latin.woff2) format("woff2"); font-weight: 100 900; font-stretch: 62% 125%; unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
@font-face { font-family: Archivo; src: url(../public/fonts/archivo-latin-ext.woff2) format("woff2"); font-weight: 100 900; font-stretch: 62% 125%; unicode-range: U+0100-02AF, U+0304, U+0308, U+0329, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1350px; overflow: hidden; background: #141513; }
body { font-family: Archivo, sans-serif; color: #f3f4f0; }
.card { position: relative; width: 1080px; height: 1350px; }
/* The photo fills the upper part only, so a wide picture keeps more of its subject than a full height crop would. */
.card__image { position: absolute; top: 0; left: 0; width: 100%; height: 960px; object-fit: cover; }
/* The top fade keeps the logo readable, the bottom fade carries the text. */
.card__shade { position: absolute; inset: 0; background:
  linear-gradient(180deg, rgba(20,21,19,.55) 0%, rgba(20,21,19,0) 16%),
  linear-gradient(180deg, rgba(20,21,19,0) 38%, rgba(20,21,19,.55) 54%, rgba(20,21,19,.92) 66%, #141513 71%); }
.logo { position: absolute; top: 64px; left: 72px; display: flex; align-items: center; gap: 14px; font-size: 44px; font-weight: 780; letter-spacing: -.035em; line-height: 1; }
.logo svg { width: 46px; height: 46px; }
/* The text starts at the top of the dark band under the photo. Anchored to the bottom, a one
   sentence page sat far down with an empty band above it. scripts/social.ts moves a text that
   would run off the bottom up until it fits, which only older long pages need. */
.text { position: absolute; left: 72px; right: 72px; top: 1000px; }
.text p { font-size: 46px; font-weight: 600; line-height: 1.24; letter-spacing: -.015em; text-wrap: pretty; }
.text p + p { margin-top: 30px; }
</style>
</head>
<body>
<div class="card">
  <img class="card__image" alt="">
  <div class="card__shade"></div>
  <div class="logo">
    <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" fill="#1430d6"/><path fill="#f3f4f0" fill-rule="evenodd" d="M6 3h8v8h12v18H6zM14 17v6h4v-6z"/></svg>
    bitpulse
  </div>
  <div class="text"></div>
</div>
</body>
</html>
